---
- name: Setup Vprofile Bastion Host
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Import bastion setup variables
      include_vars: bastion_setup

    - name: Import VPC output variables
      include_vars: vars/vpc_output_vars

    - name: Create vprofile ec2 key
      ec2_key:
        name: vprofile-key
        region: "{{ region }}"
      register: key_out

    - name: Save private key into file bastion-key.pem
      copy:
        content: "{{ key_out.key.private_key }}"
        dest: "./bastion-key.pem"
        mode: 0600
      when: key_out.changed

    - name: Create Sec Grp for bastion host
      ec2_group:
        name: Bastion-host-sg
        description: Allow port 22 from everywhere and all port within sg
        region: "{{ region }}"
        vpc_id: "{{ vpcid }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ MYIP }}/32"
      register: BastionSG_out

    - name: Creating Bastion Host
      ec2_instance:
        name: Bastion_host
        key_name: vprofile-key
        region: "{{ region }}"
        instance_type: t2.micro
        image_id: "{{ bastion_ami }}"
        vpc_subnet_id: "{{ pubsub1_id }}"
        security_group: Bastion-host-sg
        network:
          assign_public_ip: true
        state: running
        wait: yes
        wait_timeout: 300
        tags:
          Name: "Bastion_host"
          Project: Vprofile
          Owner: Devops Team
      register: bastionHost_out

    - name: Set bastion host instance fact
      set_fact:
        bastion_instance: "{{ bastionHost_out.instances[0] }}"

    - name: Ensure bastion host has a public IP
      fail:
        msg: >-
          Bastion instance {{ bastion_instance.instance_id }} does not have a public IP.
          AWS only assigns automatic public IPs when an instance is created, so Ansible
          cannot add one to this existing instance. Terminate the existing Bastion_host
          instance and rerun this playbook, or associate an Elastic IP with the instance.
      when: bastion_instance.public_ip_address is not defined

    - name: Display bastion host details
      debug:
        msg:
          - "Bastion Instance ID: {{ bastion_instance.instance_id }}"
          - "Bastion Public IP: {{ bastion_instance.public_ip_address }}"
          - "Bastion Public DNS: {{ bastion_instance.public_dns_name | default('not assigned') }}"
